name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: moon check (warnings are errors)
        run: moon check --deny-warn --target wasm,wasm-gc
      - name: moon fmt (no diff)
        run: moon fmt --check
